<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Share</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="./index.html">Share</a>
      <nav>
        <span id="who" class="muted"></span>
        <button id="logout" class="btn btn-ghost">Log out</button>
      </nav>
    </header>

    <main class="dash">
      <section class="card">
        <h1>Upload</h1>
        <form id="upload-form" class="stack">
          <label>File (video or image, max 100 MB)
            <input type="file" name="file" accept="video/*,image/*" required />
          </label>
          <div class="row">
            <label>Expires in
              <select name="expires">
                <option value="1">1 day</option>
                <option value="7" selected>7 days</option>
                <option value="30">30 days</option>
              </select>
            </label>
            <label>Max views
              <select name="views">
                <option value="10">10</option>
                <option value="100" selected>100</option>
                <option value="1000">1000</option>
              </select>
            </label>
          </div>
          <button class="btn btn-primary" type="submit">Upload</button>
        </form>
      </section>

      <section>
        <h2>Your uploads</h2>
        <ul id="uploads" class="list"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
